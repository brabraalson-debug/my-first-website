<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alson Braho | Graphic Designer</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #151615;
        color: #f2eee6;
        font-family: Arial, Helvetica, sans-serif;
        padding: 0 clamp(24px, 8vw, 120px);
      }
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 0;
        border-bottom: 1px solid #3a3b36;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #b6b7ae;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        min-height: 75svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 72px 0;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: clamp(64px, 12vw, 160px);
        letter-spacing: -0.055em;
        line-height: 1.05;
        margin: 0 0 30px;
      }
      .role {
        color: #c7b58b;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin: 0 0 24px;
      }
      .intro {
        max-width: 440px;
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.7;
        color: #b6b7ae;
        margin: 0;
      }
      footer {
        max-width: 1200px;
        margin: 0 auto;
        border-top: 1px solid #3a3b36;
        padding: 24px 0;
        color: #b6b7ae;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>Portfolio</header>
    <main>
      <h1>Alson Braho</h1>
      <p class="role">Graphic Designer</p>
      <p class="intro">Welcome to my portfolio. Explore a selection of my work below.</p>
    </main>
    <footer>Alson Braho &mdash; Graphic Designer</footer>
  </body>
</html>
